[project]
name = "urban-heat-dss"
version = "0.1.0"
description = "Urban Heat Decision Support System — evidence-based heat mitigation for Indian cities"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "rasterio>=1.3.10",
    "geopandas>=0.14.0",
    "numpy>=1.26.0",
    "pystac-client>=0.8.0",
    "planetary-computer>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "scikit-learn>=1.9.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_heat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
