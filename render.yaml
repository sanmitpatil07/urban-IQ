services:
  # ==========================================
  # BACKEND SERVICE (FastAPI / Docker)
  # ==========================================
  - type: web
    name: urban-heat-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      # We will use Render's dynamic service discovery for cross-origin URLs.
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: urban-heat-frontend
          property: url
      - key: URBAN_HEAT_DATA_DIR
        value: /app/data
    
    # Note: If you have generated model artifacts/GeoJSON files that are ignored by Git
    # and you need them in production, you have two options:
    # 1. Modify Dockerfile to download them from S3/cloud storage at build time.
    # 2. Use a Render Persistent Disk (requires a paid plan):
    # disk:
    #   name: urban-heat-data
    #   mountPath: /app/data
    #   sizeGB: 1

  # ==========================================
  # FRONTEND SERVICE (React / Vite)
  # ==========================================
  - type: web
    name: urban-heat-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDirectory: frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: urban-heat-api
          property: url
      - key: VITE_ENABLE_DEMO_MODE
        value: "false"
