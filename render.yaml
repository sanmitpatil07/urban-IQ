services:
  # ==========================================
  # BACKEND SERVICE (FastAPI / Docker)
  # ==========================================
  - type: web
    name: urban-heat-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: URBAN_HEAT_DATA_DIR
        value: /app/data
      - key: ALLOWED_ORIGINS
        value: "https://urban-heat-frontend.onrender.com"

  # ==========================================
  # FRONTEND SERVICE (React / Vite)
  # ==========================================
  - type: web
    name: urban-heat-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://urban-heat-api.onrender.com"
      - key: VITE_ENABLE_DEMO_MODE
        value: "true"